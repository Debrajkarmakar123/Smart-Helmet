<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART HELMET // Impact Deck</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Smart Helmet">

    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        /* --- CSS Variables & Reset (Same as before) --- */
        :root {
            --bg-dark: #030712;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --color-online: #34d399;
            --color-offline: #ef4444;
            --color-impact: #f59e0b; /* Amber for warning */
            --color-critical: #ef4444; /* Red for severe */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; padding-bottom: 80px; overflow-x: hidden; }
        .wrapper { width: 100%; max-width: 600px; margin: 0 auto; }

        /* --- Mobile UI Elements --- */
        header { position: sticky; top: 0; z-index: 1000; background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .nav-brand { font-size: 16px; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
        .status-badge { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; transition: all 0.3s ease; }
        .status-online { background: rgba(16, 185, 129, 0.1); color: var(--color-online); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-offline { background: rgba(239, 68, 68, 0.1); color: var(--color-offline); border: 1px solid rgba(239, 68, 68, 0.3); }
        .dot { width: 7px; height: 7px; border-radius: 50%; transition: background-color 0.3s; }
        .status-online .dot { background-color: var(--color-online); box-shadow: 0 0 10px var(--color-online); }
        .status-offline .dot { background-color: var(--color-offline); box-shadow: 0 0 10px var(--color-offline); }

        .content-container { padding: 20px; display: flex; flex-direction: column; gap: 25px; }
        .card { background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; padding: 20px; }
        .card-header-h2 { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
        .media-container { width: 100%; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); position: relative; aspect-ratio: 4/3; }
        .media-container img { width: 100%; height: 100%; object-fit: cover; }
        .plyr { height: 100%; }

        /* --- NEW: Impact Rating UI --- */
        .impact-card { border-color: rgba(245, 158, 11, 0.3); /* subtle amber border */ }
        .impact-header { color: var(--color-impact); }
        
        .rating-display { display: flex; align-items: baseline; justify-content: center; gap: 10px; margin: 15px 0; }
        .rating-value { font-size: 48px; font-weight: 900; color: var(--color-impact); transition: color 0.3s ease; }
        .rating-label { font-size: 14px; color: var(--text-muted); font-weight: 600; }

        /* Animated Meter Bar */
        .meter-container { width: 100%; height: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 5px; overflow: hidden; position: relative; }
        .meter-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--color-online), var(--color-impact), var(--color-critical)); border-radius: 5px; transition: width 0.3s ease-out; }
        
        /* Critical Alert State */
        .critical .rating-value { color: var(--color-critical); }
        .critical .meter-bar { background: var(--color-critical); width: 100% !important; animation: criticalPulse 0.5s infinite alternate; }

        @keyframes criticalPulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        /* --- Controls & Archives (Same) --- */
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { background: rgba(255, 255, 255, 0.04); color: var(--text-light); border: 1px solid rgba(255, 255, 255, 0.08); padding: 16px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s ease; }
        .btn:active { transform: scale(0.98); }
        .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; grid-column: span 2; }

        .recordings-list { display: flex; flex-direction: column; gap: 12px; }
        .record-item { display: flex; justify-content: space-between; align-items: center; background: rgba(17, 24, 39, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); padding: 16px; border-radius: 12px; color: var(--color-online); font-size: 14px; font-weight: 600; }
        .record-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .play-tag { font-size: 11px; background: rgba(16, 185, 129, 0.1); color: var(--color-online); padding: 6px 12px; border-radius: 20px; font-weight: 700; }
        
        .mobile-footer { text-align: center; padding: 20px; font-size: 11px; color: var(--text-muted); border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 10px; }
        .footer-name { color: var(--color-online); font-weight: 700; }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <div class="nav-brand"><span class="helmet-icon">🪖</span> MOBILE // DECK</div>
            <div id="statusBadge" class="status-badge status-offline">
                <div class="dot"></div>
                <span id="statusText">CONNECTING...</span>
            </div>
        </header>

        <div class="content-container">
            
            <!-- --- NEW: Impact Rating Panel --- -->
            <div id="impactCard" class="card impact-card">
                <div class="card-header-h2">
                    <span class="impact-header">⚡ IMPACT ALERT</span>
                    <span id="impactTimestamp" style="font-weight: 400; text-transform: none;">Monitoring...</span>
                </div>
                <div class="rating-display">
                    <span id="ratingValue" class="rating-value">0.0</span>
                    <span class="rating-label">g-Force Severity</span>
                </div>
                <div class="meter-container">
                    <div id="meterBar" class="meter-bar"></div>
                </div>
            </div>

            <!-- Live Stream Panel -->
            <div class="card">
                <div class="card-header-h2"><h2>Live Feed</h2></div>
                <div class="media-container">
                    <img id="liveStreamImg" src="http://localhost:5000/video_feed" alt="Connecting to Helmet..." onerror="handleStreamError()" onload="handleStreamSuccess()">
                </div>
            </div>

            <!-- Operations Panel -->
            <div class="card">
                <div class="card-header-h2"><h2>Command</h2></div>
                <div class="controls-grid">
                    <a href="http://192.168.4.20/capture" target="_blank" class="btn btn-blue">📷 CAPTURE SNAPSHOT</a>
                </div>
            </div>
        </div>

        <footer class="mobile-footer">
            SMART HELMET COMMAND SYSTEM &bull; BY <span class="footer-name">DEBRAJ KARMAKAR</span>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const player = new Plyr('#player');

        // --- Streaming Status Logic (Same as before) ---
        const badge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        function handleStreamSuccess() { badge.className = "status-badge status-online"; statusText.innerText = "ONLINE"; }
        function handleStreamError() { badge.className = "status-badge status-offline"; statusText.innerText = "OFFLINE"; badge.classList.remove('critical'); }

        setInterval(() => {
            const img = document.getElementById('liveStreamImg');
            const testImg = new Image();
            testImg.onload = handleStreamSuccess;
            testImg.onerror = handleStreamError;
            testImg.src = img.src.split('?')[0] + '?ping=' + new Date().getTime();
        }, 5000);


        // --- NEW: MOCK IMPACT RATING LOGIC ---
        const impactCard = document.getElementById('impactCard');
        const ratingValueDisplay = document.getElementById('ratingValue');
        const meterBar = document.getElementById('meterBar');
        const timestampDisplay = document.getElementById('impactTimestamp');
        
        let currentRating = 0.0;
        let decayInterval;

        // Function to update UI based on rating
        function updateImpactUI(rating) {
            rating = Math.max(0, Math.min(15, rating)); // Clamp between 0 and 15g
            ratingValueDisplay.innerText = rating.toFixed(1);
            
            // Update Meter Width (0 to 100%)
            const percentage = (rating / 15) * 100;
            meterBar.style.width = `${percentage}%`;

            // Color & Animation States
            if (rating > 10) {
                impactCard.classList.add('critical'); // Flashing red alert
            } else {
                impactCard.classList.remove('critical');
                // Change meter color based on severity manually if CSS var fails
                if (rating > 5) meterBar.style.background = 'var(--color-impact)';
                else meterBar.style.background = 'var(--color-online)';
            }

            if (rating > 0.1) {
                 timestampDisplay.innerText = new Date().toLocaleTimeString();
            }
        }

        // Function to simulate an impact (called externally, e.g. from motion detect)
        function simulateImpact(force) {
             // Reset decay
             clearInterval(decayInterval);
             
             // Set new high rating
             currentRating = force;
             updateImpactUI(currentRating);
             
             // Start decaying back to 0
             decayInterval = setInterval(() => {
                 currentRating -= 0.1;
                 if(currentRating <= 0) {
                     currentRating = 0;
                     clearInterval(decayInterval);
                 }
                 updateImpactUI(currentRating);
             }, 100); // decay every 100ms
        }

        // DEMO: Simulate a random impact every 15 seconds just to show it working
        // In reality, you would call simulateImpact(intensityValue) from your video motion logic
        setInterval(() => {
             if (statusText.innerText === "ONLINE") {
                  const randomForce = Math.random() * 12; // Random g-force between 0 and 12
                  simulateImpact(randomForce);
             }
        }, 15000);

    </script>
</body>
</html>
